<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080b1b">
<title>NEON//RUN — Beat Dash</title>
<style>
:root{color-scheme:dark;--cyan:#54f6ff;--pink:#ff4eae;--ink:#080b1b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:'Space Grotesk',sans-serif;color:#f5f8ff;touch-action:none}body{display:grid;place-items:center}.shell{position:relative;width:min(100vw,1440px);height:min(100dvh,850px);overflow:hidden;background:#090d20;isolation:isolate}.shell:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background:linear-gradient(180deg,rgba(8,11,27,.02) 55%,rgba(8,11,27,.38));box-shadow:inset 0 0 140px rgba(0,0,0,.42)}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;z-index:3;inset:0;pointer-events:none}.topline{position:absolute;top:calc(clamp(18px,4vh,36px) + env(safe-area-inset-top));left:clamp(20px,5vw,68px);right:clamp(20px,5vw,68px);display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:13px;font-weight:700;letter-spacing:.23em;color:rgba(233,242,255,.86)}.brand b{color:var(--cyan);font-weight:700}.right-tools{display:flex;gap:12px;align-items:center;pointer-events:auto}.icon-btn{width:40px;height:40px;border:1px solid rgba(163,191,255,.2);background:rgba(18,26,52,.52);border-radius:12px;color:#dfe9ff;font-size:16px;cursor:pointer;backdrop-filter:blur(8px)}.icon-btn:hover{border-color:var(--cyan);color:var(--cyan)}.stats{position:absolute;top:clamp(72px,12vh,105px);left:50%;transform:translateX(-50%);text-align:center;transition:opacity .2s}.score{font-size:clamp(22px,3vw,34px);font-weight:700;letter-spacing:.08em;font-variant-numeric:tabular-nums}.score small{font-size:10px;color:#8da0c4;letter-spacing:.2em;display:block;margin-top:1px}.progress{position:absolute;top:clamp(132px,19vh,166px);left:50%;transform:translateX(-50%);width:min(310px,42vw);height:3px;background:rgba(184,205,255,.16);border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),#a68cff,var(--pink));box-shadow:0 0 12px var(--cyan);border-radius:99px}.beat{position:absolute;left:50%;top:clamp(153px,22vh,190px);transform:translateX(-50%);font:10px 'DM Mono',monospace;letter-spacing:.25em;color:rgba(194,210,242,.52)}.overlay{position:absolute;z-index:4;inset:0;display:grid;place-items:center;padding:24px;transition:opacity .28s,visibility .28s}.overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}.card{width:min(530px,92vw);text-align:center;padding:clamp(28px,5vw,53px) clamp(22px,5vw,54px);border:1px solid rgba(133,174,255,.2);border-radius:22px;background:linear-gradient(145deg,rgba(17,26,53,.86),rgba(8,13,31,.88));box-shadow:0 28px 100px rgba(0,0,0,.45),inset 0 1px rgba(255,255,255,.06);backdrop-filter:blur(18px)}.eyebrow{font:500 10px 'DM Mono',monospace;letter-spacing:.3em;color:var(--cyan);margin-bottom:18px}.title{margin:0;font-size:clamp(39px,8vw,70px);line-height:.95;letter-spacing:-.07em;font-weight:700}.title span{color:var(--cyan);text-shadow:0 0 30px rgba(84,246,255,.45)}.subtitle{max-width:355px;margin:17px auto 25px;color:#aab8d5;font-size:14px;line-height:1.55}.primary{border:0;border-radius:12px;padding:15px 32px;background:linear-gradient(105deg,#60f5ff,#8ca4ff);box-shadow:0 7px 30px rgba(73,228,255,.24);color:#06101e;font:700 12px 'Space Grotesk',sans-serif;letter-spacing:.18em;cursor:pointer;transition:transform .15s,filter .15s}.primary:hover{transform:translateY(-2px);filter:brightness(1.1)}.hint{margin-top:19px;color:#667797;font:10px 'DM Mono',monospace;letter-spacing:.12em}.keys{display:flex;justify-content:center;gap:9px;margin-top:20px}.key{border:1px solid rgba(174,199,255,.2);border-radius:7px;padding:6px 9px;color:#afbdd9;font:10px 'DM Mono',monospace}.bottom{position:absolute;bottom:calc(clamp(18px,4vh,34px) + env(safe-area-inset-bottom));left:clamp(20px,5vw,68px);right:clamp(20px,5vw,68px);display:flex;justify-content:space-between;align-items:end;color:rgba(174,193,226,.5);font:9px 'DM Mono',monospace;letter-spacing:.16em}.tap-hint{position:absolute;bottom:calc(clamp(70px,12vh,100px) + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font:10px 'DM Mono',monospace;letter-spacing:.22em;color:rgba(222,239,255,.72);white-space:nowrap;transition:opacity .3s}.tap-hint.off{opacity:0}.toast{position:absolute;left:50%;top:31%;transform:translate(-50%,-10px);color:var(--cyan);font:500 10px 'DM Mono',monospace;letter-spacing:.25em;text-shadow:0 0 16px var(--cyan);opacity:0;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-height:520px){.topline{top:12px}.stats{top:55px}.progress{top:102px}.beat{top:116px}.bottom{bottom:10px}.tap-hint{bottom:48px}.card{padding:22px}.subtitle{margin:10px auto 14px}.keys{margin-top:12px}}
</style>
</head>
<body>
<main class="shell" id="shell">
<canvas id="game" aria-label="Neon beat dash game"></canvas>
<div class="hud">
  <div class="topline"><div class="brand">N<span style="color:#fff">/</span><b>R</b> <span style="color:#657493;font-weight:500">&nbsp;BEAT DASH</span></div><div class="right-tools"><button class="icon-btn" id="soundBtn" aria-label="Toggle sound" title="Toggle sound">♫</button><button class="icon-btn" id="pauseBtn" aria-label="Pause" title="Pause">Ⅱ</button></div></div>
  <div class="stats" id="stats"><div class="score" id="score">0000<small>SCORE</small></div></div>
  <div class="progress" id="progress"><i id="progressFill"></i></div><div class="beat" id="beatLabel">120 BPM &nbsp;·&nbsp; TAP TO THE BEAT</div>
  <div class="tap-hint off" id="tapHint">TAP / SPACE TO JUMP</div><div class="toast" id="toast">PERFECT!</div>
  <div class="bottom"><span>VOL. 01 &nbsp;—&nbsp; CYBER CIRCUIT</span><span id="bestLabel">BEST&nbsp; 0000</span></div>
</div>
<div class="overlay" id="overlay"><section class="card"><div class="eyebrow" id="eyebrow">A RHYTHM RUNNER</div><h1 class="title" id="title">NEON<span>//</span><br>RUN</h1><p class="subtitle" id="subtitle">One button. One beat. Keep your cool and leap through the rhythm.</p><button class="primary" id="mainBtn">START RUN&nbsp; ↗</button><div class="keys"><span class="key">TAP</span><span class="key">SPACE</span><span class="key">↑</span></div><div class="hint" id="hint">JUMP ON THE BEAT FOR A PERFECT BONUS</div></section></div>
</main>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const shell=document.getElementById('shell'),overlay=document.getElementById('overlay'),mainBtn=document.getElementById('mainBtn'),pauseBtn=document.getElementById('pauseBtn'),soundBtn=document.getElementById('soundBtn');
const scoreEl=document.getElementById('score'),progressFill=document.getElementById('progressFill'),tapHint=document.getElementById('tapHint'),toast=document.getElementById('toast'),bestLabel=document.getElementById('bestLabel');
const BPM=120,BEAT=60/BPM, SPEED=390,GROUND_RATIO=.79,PLAYER_X=.24,GRAVITY=2050,JUMP_V=-735,LEVEL_BEATS=64,LEVEL_LENGTH=LEVEL_BEATS*BEAT*SPEED;
let w=0,h=0,dpr=1,ground=0,state='menu',lastTime=0,elapsed=0,world=0,score=0,best=+(localStorage.getItem('neonrun-best')||0),audio=null,soundOn=true,beatFlash=0,particles=[],toastTimer=0,shake=0;
let player={y:0,vy:0,size:36,rotation:0,grounded:true,trail:[]},obstacles=[],passed=new Set(),lastJumpTime=-99,perfect=false;
bestLabel.textContent='BEST  '+String(best).padStart(4,'0');
function resize(){const r=shell.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ground=h*GROUND_RATIO;player.size=Math.max(26,Math.min(42,w*.037));if(state!=='playing')player.y=ground-player.size}
window.addEventListener('resize',resize);resize();
function makeLevel(){
 // Every obstacle begins on a musical beat; gaps are deliberate landing windows.
 const pattern=[
 [4,'spike'],[7,'spike'],[10,'double'],[14,'block'],[18,'spike'],[21,'double'],[25,'spike'],[28,'block'],[32,'double'],[36,'spike'],[39,'block'],[43,'double'],[47,'spike'],[50,'double'],[54,'block'],[58,'spike'],[61,'double']
 ];
 obstacles=pattern.map(([beat,type])=>({x:beat*BEAT*SPEED+250,type,beat,width:type==='double'?68:type==='block'?46:42,passed:false}));
}
makeLevel();
function initAudio(){if(!soundOn)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){}}
function tone(freq,duration,volume=.07,type='sine',delay=0){if(!audio||!soundOn)return;const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+duration+.01)}
function beatSound(){tone(beatFlash>0?880:110,.055,beatFlash>0?.025:.014,'sine')}
function start(){initAudio();state='playing';elapsed=0;world=0;score=0;passed.clear();particles=[];player.y=ground-player.size;player.vy=0;player.grounded=true;player.rotation=0;lastJumpTime=-99;overlay.classList.add('hidden');tapHint.classList.remove('off');pauseBtn.textContent='Ⅱ';lastTime=performance.now();beatFlash=0;updateScore();requestAnimationFrame(loop)}
function showOverlay(mode){state=mode;overlay.classList.remove('hidden');tapHint.classList.add('off');pauseBtn.textContent=mode==='paused'?'▶':'Ⅱ';if(mode==='paused'){document.getElementById('eyebrow').textContent='TAKE A BREATHER';document.getElementById('title').innerHTML='PAUSE<span>.</span>';document.getElementById('subtitle').textContent='The beat will be right here when you’re ready.';mainBtn.textContent='KEEP RUNNING  ↗';document.getElementById('hint').textContent='YOUR RUN IS SAVED';document.querySelector('.keys').style.display='none'}else if(mode==='dead'){document.getElementById('eyebrow').textContent='THE BEAT GOES ON';document.getElementById('title').innerHTML='TRY<br><span>AGAIN?</span>';document.getElementById('subtitle').textContent='You made it '+Math.floor(world/LEVEL_LENGTH*100)+'% through the circuit. Find the beat and go again.';mainBtn.textContent='RETRY RUN  ↗';document.getElementById('hint').textContent='TIP: TAP JUST BEFORE THE OBSTACLE';document.querySelector('.keys').style.display='flex'}else if(mode==='win'){document.getElementById('eyebrow').textContent='CIRCUIT COMPLETE';document.getElementById('title').innerHTML='YOU<br><span>SHINED.</span>';document.getElementById('subtitle').textContent='Perfect rhythm. Total score: '+score+'. That was a clean run.';mainBtn.textContent='RUN IT BACK  ↗';document.getElementById('hint').textContent='THE BEAT NEVER STOPS';document.querySelector('.keys').style.display='flex'}else{document.getElementById('eyebrow').textContent='A RHYTHM RUNNER';document.getElementById('title').innerHTML='NEON<span>//</span><br>RUN';document.getElementById('subtitle').textContent='One button. One beat. Keep your cool and leap through the rhythm.';mainBtn.textContent='START RUN  ↗';document.getElementById('hint').textContent='JUMP ON THE BEAT FOR A PERFECT BONUS';document.querySelector('.keys').style.display='flex'}lastTime=performance.now()}
function resume(){initAudio();state='playing';overlay.classList.add('hidden');tapHint.classList.remove('off');pauseBtn.textContent='Ⅱ';lastTime=performance.now();requestAnimationFrame(loop)}
function togglePause(){if(state==='playing'){showOverlay('paused')}else if(state==='paused')resume()}
mainBtn.addEventListener('click',()=>state==='paused'?resume():start());pauseBtn.addEventListener('click',togglePause);
soundBtn.addEventListener('click',()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'♫':'♩';if(soundOn)initAudio()});
function jump(){if(state!=='playing')return;if(!player.grounded)return;initAudio();const now=elapsed,nearBeat=Math.round(now/BEAT)*BEAT;perfect=Math.abs(now-nearBeat)<.115;lastJumpTime=now;player.vy=JUMP_V;player.grounded=false;if(perfect){score+=50;showToast('PERFECT +50');tone(660,.09,.06,'triangle');tone(990,.12,.04,'triangle',.07)}else tone(420,.07,.035,'triangle');for(let i=0;i<7;i++)particles.push({x:w*PLAYER_X+player.size/2,y:ground-3,vx:(Math.random()-.5)*140,vy:-Math.random()*180-30,life:.35+Math.random()*.2,color:perfect?'#54f6ff':'#a08cff',r:1+Math.random()*2})}
function showToast(text){toast.textContent=text;toast.classList.add('show');toastTimer=.75}
function updateScore(){scoreEl.innerHTML=String(score).padStart(4,'0')+'<small>SCORE</small>'}
function die(){if(state!=='playing')return;state='dead';shake=9;tone(125,.28,.09,'sawtooth');if(score>best){best=score;localStorage.setItem('neonrun-best',best);bestLabel.textContent='BEST  '+String(best).padStart(4,'0')}setTimeout(()=>showOverlay('dead'),450)}
function win(){if(state!=='playing')return;state='win';score+=500;updateScore();tone(523,.22,.07,'triangle');tone(659,.22,.07,'triangle',.13);tone(784,.4,.07,'triangle',.26);if(score>best){best=score;localStorage.setItem('neonrun-best',best);bestLabel.textContent='BEST  '+String(best).padStart(4,'0')}setTimeout(()=>showOverlay('win'),520)}
function loop(t){if(state!=='playing')return;let dt=Math.min((t-lastTime)/1000,.034);lastTime=t;elapsed+=dt;world+=SPEED*dt;beatFlash=Math.max(0,beatFlash-dt*3.4);const beatIndex=Math.floor(elapsed/BEAT);if(Math.floor((elapsed-dt)/BEAT)!==beatIndex){beatFlash=1;beatSound()}
 player.vy+=GRAVITY*dt;player.y+=player.vy*dt;if(player.y>=ground-player.size){player.y=ground-player.size;player.vy=0;player.grounded=true}if(!player.grounded)player.rotation+=dt*5.2;else player.rotation=Math.round(player.rotation/(Math.PI/2))*(Math.PI/2);
 const px=w*PLAYER_X,pr=player.size;for(const o of obstacles){const ox=px+(o.x-world);if(ox<-100||ox>w+100||passed.has(o.beat))continue;if(ox+o.width<px){passed.add(o.beat);score+=100;updateScore();continue}if(ox<px+pr-4&&ox+o.width>px+5){const top=o.type==='block'?ground-47:ground-34;const bottom=player.y+pr-3;if(bottom>top+7){die();break}}}
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=420*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}
 if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)toast.classList.remove('show')}
 if(world>=LEVEL_LENGTH){win();draw();return}
 progressFill.style.width=(world/LEVEL_LENGTH*100)+'%';if(elapsed>2)tapHint.classList.add('off');draw();requestAnimationFrame(loop)}
function roundedRect(c,x,y,ww,hh,r){c.beginPath();c.roundRect(x,y,ww,hh,r)}
function draw(){const time=elapsed,beat=Math.floor(time/BEAT),pulse=beatFlash;ctx.clearRect(0,0,w,h);
 const bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#0b1027');bg.addColorStop(.55,'#101735');bg.addColorStop(1,'#0b1020');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
 // soft color clouds
 const glow=ctx.createRadialGradient(w*.72,h*.42,0,w*.72,h*.42,w*.55);glow.addColorStop(0,`rgba(74,76,178,${.16+pulse*.1})`);glow.addColorStop(1,'rgba(40,54,132,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);
 // distant skyline
 const shift=(world*.12)%130;for(let i=-1;i<w/130+2;i++){let x=i*130-shift;let bh=70+((i*37+91)%110);ctx.fillStyle='rgba(25,36,75,.38)';ctx.fillRect(x,ground-bh,82,bh);ctx.fillStyle='rgba(84,246,255,.10)';for(let j=0;j<3;j++)if((i+j)%3===0)ctx.fillRect(x+12+j*20,ground-bh+15,3,14)}
 // beat grid lines
 const beatW=SPEED*BEAT,offset=(world%beatW);ctx.lineWidth=1;for(let x=-offset;x<w+beatW;x+=beatW){let beatNo=Math.floor(world/beatW)+Math.round((x+offset)/beatW);const alpha=(beatNo%4===0?.11:.045)+pulse*(beatNo%4===0?.2:.06);ctx.strokeStyle=`rgba(92,202,255,${alpha})`;ctx.beginPath();ctx.moveTo(x,100);ctx.lineTo(x,ground);ctx.stroke();if(beatNo%4===0){ctx.fillStyle=`rgba(137,175,255,${.24+pulse*.3})`;ctx.font='9px DM Mono';ctx.fillText(String((beatNo%64+64)%64+1).padStart(2,'0'),x+5,ground-13)}}
 // floor and luminous edge
 const floor=ctx.createLinearGradient(0,ground,0,h);floor.addColorStop(0,'rgba(28,44,86,.88)');floor.addColorStop(1,'rgba(10,15,34,1)');ctx.fillStyle=floor;ctx.fillRect(0,ground,w,h-ground);ctx.fillStyle=`rgba(84,246,255,${.57+pulse*.38})`;ctx.fillRect(0,ground-2,w,2);ctx.shadowBlur=18;ctx.shadowColor='#54f6ff';ctx.fillRect(0,ground-2,w,1);ctx.shadowBlur=0;
 for(const o of obstacles){const x=w*PLAYER_X+(o.x-world);if(x<-100||x>w+100)continue;drawObstacle(x,o)}
 // player shadow
 const px=w*PLAYER_X,sz=player.size;ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(px+sz/2,ground+3,sz*.68,5,0,0,Math.PI*2);ctx.fill();
 // trail
 if(state==='playing'&&!player.grounded){ctx.globalAlpha=.16;for(let i=0;i<3;i++){ctx.fillStyle='#54f6ff';ctx.fillRect(px-sz*(i+1)*.52,player.y+sz*.3,sz*.3,sz*.4)}ctx.globalAlpha=1}
 ctx.save();ctx.translate(px+sz/2,player.y+sz/2);ctx.rotate(player.rotation);const cube=ctx.createLinearGradient(-sz/2,-sz/2,sz/2,sz/2);cube.addColorStop(0,'#c4fbff');cube.addColorStop(.35,'#58edff');cube.addColorStop(1,'#657aff');ctx.shadowBlur=20;ctx.shadowColor='#54f6ff';roundedRect(ctx,-sz/2,-sz/2,sz,sz,6);ctx.fillStyle=cube;ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1.4;ctx.stroke();ctx.fillStyle='#101b3d';roundedRect(ctx,-sz*.24,-sz*.15,sz*.14,sz*.17,2);ctx.fill();roundedRect(ctx,sz*.1,-sz*.15,sz*.14,sz*.17,2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.6)';ctx.fillRect(-sz*.29,-sz*.3,sz*.2,2);ctx.restore();
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*2.7);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.r,p.r);ctx.globalAlpha=1}
 // scenic top light bars
 ctx.fillStyle='rgba(113,153,255,.12)';ctx.fillRect(w*.08,0,w*.2,2);ctx.fillStyle='rgba(84,246,255,.28)';ctx.fillRect(w*.08,0,Math.min(w*.2,world/LEVEL_LENGTH*w*.2),2);
}
function drawObstacle(x,o){const g=ground;ctx.save();if(o.type==='block'){ctx.shadowBlur=16;ctx.shadowColor='rgba(255,78,174,.55)';const grad=ctx.createLinearGradient(x,g-50,x+o.width,g);grad.addColorStop(0,'#ff73bb');grad.addColorStop(1,'#8e4fff');ctx.fillStyle=grad;ctx.beginPath();ctx.moveTo(x,g);ctx.lineTo(x,g-45);ctx.lineTo(x+o.width-8,g-45);ctx.lineTo(x+o.width,g-37);ctx.lineTo(x+o.width,g);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,231,247,.7)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x+8,g-38);ctx.lineTo(x+o.width-10,g-38);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.16)';ctx.fillRect(x+8,g-30,o.width-16,3)}else{const count=o.type==='double'?2:1,sw=o.type==='double'?35:42;for(let i=0;i<count;i++){const xx=x+i*sw;ctx.shadowBlur=16;ctx.shadowColor='rgba(255,78,174,.5)';const gr=ctx.createLinearGradient(xx,g-38,xx+sw,g);gr.addColorStop(0,'#ff8bc9');gr.addColorStop(1,'#bc4fff');ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(xx,g);ctx.lineTo(xx+sw*.5,g-38);ctx.lineTo(xx+sw,g);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,236,250,.66)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(xx+sw*.5,g-32);ctx.lineTo(xx+sw*.84,g-4);ctx.stroke()}}ctx.restore()}
function frame(t){if(state==='playing')return;const dt=Math.min((t-lastTime)/1000,.04);lastTime=t;if(state==='menu'){elapsed+=dt;beatFlash=Math.max(0,beatFlash-dt*3.4);if(Math.floor(elapsed/BEAT)!==Math.floor((elapsed-dt)/BEAT)){beatFlash=1;beatSound()}}draw();requestAnimationFrame(frame)}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(state==='playing')jump()});window.addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(state==='playing')jump();else if(state==='menu'||state==='dead'||state==='win')start();else if(state==='paused')resume()}if(e.code==='Escape'||e.code==='KeyP')togglePause()});
// Accessible tap-to-start from the title card; animate the idle beat in the background.
mainBtn.addEventListener('pointerdown',()=>initAudio());lastTime=performance.now();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
